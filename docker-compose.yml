services:
  db:
    image: postgres:16-alpine
    container_name: tazalyk_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tazalyk
      - POSTGRES_USER=postgres
      # пароль берётся из backend/.env, в репозитории его быть не должно
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Укажите DB_PASSWORD в backend/.env}
    # только с этого компьютера: иначе база будет видна всей локальной сети
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: .
    container_name: tazalyk_backend
    restart: always
    # сервер разработки перезапускается при правках кода; в образе по умолчанию gunicorn
    command: python manage.py runserver 0.0.0.0:8000
    # API для локальной разработки — тоже только с этого компьютера
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DB_NAME=tazalyk
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:?Укажите DB_PASSWORD в backend/.env}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_DEBUG=1
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  # основная база с контентом и пользователями (создана ещё в проекте tazalyk_backend);
  # без явного имени Docker создавал бы новую пустую базу при каждом переименовании папки
  postgres_data:
    external: true
    name: tazalyk_backend_postgres_data