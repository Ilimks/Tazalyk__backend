services:
  db:
    image: postgres:16-alpine
    container_name: tazalyk_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tazalyk
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Укажите DB_PASSWORD в backend/.env}
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: .
    container_name: tazalyk_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DB_NAME=tazalyk
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:?Укажите DB_PASSWORD в backend/.env}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_DEBUG=1
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
    external: true
    name: tazalyk_backend_postgres_data